# fastevals bundled model registry.
# Prices are USD per 1M tokens; keep them current for honest cost reports.
#
# Override per project: create ./config/models.toml in your working
# directory, or point --registry at any TOML file. Entries below are the
# shipped default; paste-ready reference blocks for other models follow.

["openai:gpt-5.6-luna"]
provider = "openai"
model = "gpt-5.6-luna"
api_key_env = "OPENAI_API_KEY"
reasoning_efforts = "none|low"
input_cost_usd_per_mtok = 1.0
cached_input_cost_usd_per_mtok = 0.1
output_cost_usd_per_mtok = 6.0

# --- Reference: paste into this file (or your own registry) to enable ---

