[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastevals"
version = "0.1.5"
description = "Small, provider-agnostic evaluation runner for LLM applications."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dmitry Semenov"}]
keywords = ["llm", "evaluation", "benchmark", "litellm", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23",
  "litellm>=1.74",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-jsonschema>=4.23",
  "mcp>=1.2",
]

[project.scripts]
fastevals = "fastevals.cli:main"
fastevals-mcp = "fastevals.mcp_server:main"

[tool.setuptools.packages.find]
include = ["fastevals*"]

[tool.setuptools.package-data]
fastevals = ["py.typed", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "C4",  # comprehensions
  "RUF", # ruff-specific
]

[tool.mypy]
files = ["fastevals"]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["fastevals"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
