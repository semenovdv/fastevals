[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasteval"
version = "0.1.0"
description = "Small, provider-agnostic evaluation runner for LLM applications."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dmitry Semenov"}]
keywords = ["llm", "evaluation", "benchmark", "litellm", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
native = [
  "litellm>=1.74",
]
mcp = [
  "mcp>=1.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.23",
]

[project.scripts]
fasteval = "fasteval.cli:main"
fasteval-mcp = "fasteval.mcp_server:main"

[tool.setuptools.packages.find]
include = ["fasteval*"]

[tool.setuptools.package-data]
fasteval = ["py.typed"]
