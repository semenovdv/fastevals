[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasteval"
version = "0.1.0"
description = "Small, provider-agnostic evaluation runner for LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dmitry Semenov"}]
dependencies = []

[project.optional-dependencies]
native = [
  "litellm>=1.74",
]
dev = [
  "pytest>=8.0"
]


[project.scripts]
fasteval = "fasteval.cli:main"

[tool.setuptools.packages.find]
include = ["fasteval*"]
